specVersion: 1.3.0
description: StoryHunt - first IPFi Story Native AMM DEX to trade Tokens, NFTs and IPs. Anything and Everything.
repository: https://github.com/ipdotworld/storyhunt-subgraph-new.git
schema:
  file: ./schema.graphql
features:
  - nonFatalErrors
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum/contract
    name: IPWorld
    network: story-aeneid
    source:
      address: '0x77475A8ca1AfE6a6dc9E82B32210709054937099'
      abi: IPWorld
      startBlock: 14781450
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/ipworld.ts
      entities:
        - Pool
        - Token
        - IpTokenLink
        - TokenRewardSummary
        - IpRewardSummary
        - GlobalRewardSummary
        - WalletAirdropSummary
        - WalletTokenAirdropSummary
        - TokenAirdropClaimSummary
        - WalletAirdropClaim
      abis:
        - name: IPWorld
          file: ./abis/IPWorld.json
        - name: Pool
          file: ./abis/Pool.json
        - name: ERC20
          file: ./abis/ERC20.json
        - name: ERC20SymbolBytes
          file: ./abis/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ./abis/ERC20NameBytes.json
      eventHandlers:
        # Shared events (all contract versions)
        - event: Linked(indexed address,indexed address)
          handler: handleLinked
        # V2 events (current implementation)
        - event: TokenDeployed(indexed address,indexed address,indexed address,int24[],uint256[])
          handler: handleTokenDeployed
        # V3 events (post contract upgrade)
        - event: HarvestDistributed(indexed address,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleHarvestDistributed
        - event: AirdropClaimedUgc(indexed address,indexed address,uint256,uint256)
          handler: handleAirdropClaimedUgc
        - event: AirdropClaimedHolder(indexed address,indexed address,uint256,uint256)
          handler: handleAirdropClaimedHolder
        - event: TreasuryFlushed(indexed address,indexed address,uint256)
          handler: handleTreasuryFlushed
        - event: ReferralFeePaid(indexed address,indexed address,indexed address,uint256)
          handler: handleReferralFeePaid

  - kind: ethereum/contract
    name: IPOwnerVault
    network: story-aeneid
    source:
      address: '0x276679F9e03d2E99350d407f964b5b42A3f01c73'
      abi: IPOwnerVault
      startBlock: 14781450
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/ipowner-vault.ts
      entities:
        - TokenRewardSummary
        - IpRewardSummary
        - GlobalRewardSummary
      abis:
        - name: IPOwnerVault
          file: ./abis/IPOwnerVault.json
        - name: Pool
          file: ./abis/pool.json
      eventHandlers:
        - event: VestedTokensAndEthClaimed(indexed address,indexed address,uint256,uint256)
          handler: handleVestedTokensAndEthClaimed
        - event: VestingScheduleCreated(indexed address,uint256,uint64,uint64)
          handler: handleVestingScheduleCreated
        - event: ReleasedVested(indexed address,uint256)
          handler: handleReleasedVested

templates:
  - kind: ethereum/contract
    name: Pool
    network: story-aeneid
    source:
      abi: Pool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/pool/index.ts
      entities:
        - Pool
        - Token
      abis:
        - name: Pool
          file: ./abis/pool.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Initialize(uint160,int24)
          handler: handleInitialize
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
        - event: Mint(address,indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
          handler: handleMint
